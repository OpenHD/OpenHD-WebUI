name: build_webui_radxa_arm64_debian

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev-release"
      - "release"
      - "openhd-3.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-arm64-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: Build and publish Debian Bookworm ARM64 package
        run: |
          set -o pipefail
          ./build.sh Clean CloudsmithPublish \
            --runtime-identifiers linux-arm64 \
            --distro debian \
            --release bookworm 2>&1 | tee build-radxa-arm64.log

      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-radxa-arm64
          path: build-radxa-arm64.log
          if-no-files-found: warn

      - name: Upload package
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenHD-WebUI-bookworm-arm64
          path: out/deb/*.deb
          if-no-files-found: warn
